[package]
name = "kairn"
version = "0.1.0"
edition = "2024"
description = "Snapshot a directory tree and diff what changed - no git required. Built for humans and agents."
license = "MIT"
repository = "https://github.com/rvben/kairn"
keywords = ["filesystem", "diff", "snapshot", "cli", "agent"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
jiff = "0.2"
owo-colors = "4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
